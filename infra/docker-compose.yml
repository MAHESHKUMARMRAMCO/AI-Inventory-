# Dev-only infra: SQL Server + Redis. Application services (backend/bff/frontend)
# run separately via `npm run dev` in their own folders — they are NOT containerized
# here, only their infra dependencies are.
#
# After the sqlserver container is healthy, run db/sql/001_M08945_orderfulfillment_schema.sql
# against it manually (e.g. via sqlcmd or Azure Data Studio) — this project never
# runs migrations automatically.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: m08945-sqlserver
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Ch@ngeMe123!'
      MSSQL_PID: 'Developer'
    ports:
      - '1433:1433'
    volumes:
      - m08945_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Ch@ngeMe123!" -C -Q "SELECT 1" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: m08945-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  m08945_sqlserver_data:
